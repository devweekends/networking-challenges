# dnsmasq.conf for the home router (challenge 5).
# dnsmasq is two servers in one program: a DHCP server (it hands out addresses) and a DNS server
# (it answers questions about names). Lines that start with # are notes.
# Four things are missing on purpose. Each gap is marked TODO. Fill them in, then run:  bash test.sh

# --- Where to listen ---
# TODO 1: Listen on the inside of the router only. The inside is the bridge called br-home.
#   Why: the other plug faces "the internet". A home router must not answer name questions from there.
#   Shape: interface=NAME
# bind-interfaces: listen on that interface's own address, and not on the others.
bind-interfaces

# --- Things that keep the lab simple ---
# no-resolv: do not copy upstream DNS servers from /etc/resolv.conf. The lab has no real internet.
# A question about a name we do not know gets the answer REFUSED.
no-resolv
# no-hosts: do not read /etc/hosts.
no-hosts
# user=root: in the lab we are root already. This keeps dnsmasq from switching to another user.
user=root
# log-facility=- sends the log to the screen (here: to a log file). log-dhcp logs every DHCP message.
log-facility=-
log-dhcp
# The lease file is dnsmasq's list of who has which address. The script deletes it before each start.
dhcp-leasefile=/tmp/networking-course-dnsmasq.leases

# --- DHCP: which addresses to give out ---
# TODO 2: Give out addresses from 192.168.1.100 to 192.168.1.150, with the mask 255.255.255.0 and a lease time of 1 hour (1h).
#   Why: the router itself is 192.168.1.1. The pool starts at .100, so it never hands out an address that someone set by hand.
#   Shape: dhcp-range=FIRST,LAST,MASK,LEASE_TIME

# --- DHCP: what else the lease says ---
# TODO 3: Put two more things in the lease. Both point at the router, 192.168.1.1:
#     the default gateway (option router): "send everything else to me"
#     the DNS server (option dns-server): "ask me for names"
#   dnsmasq would send its own address for both even without these lines. Write them anyway, so the file says what it means.
#   Shape: dhcp-option=option:NAME,ADDRESS     (one line for each)

# --- DNS: a name of our own ---
# TODO 4: Make the name web.test answer 203.0.113.80, the public web server.
#   Why: the lab has no real DNS, so the router is the only place that knows this name.
#   Shape: address=/NAME/ADDRESS
