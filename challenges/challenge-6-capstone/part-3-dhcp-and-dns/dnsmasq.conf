# dnsmasq.conf for the capstone home router. Start from your challenge 5 config.
# One dnsmasq serves both subnets, so you need:
#   - the two inside interfaces (not the outside one)
#   - a home pool 192.168.1.100 to 192.168.1.150 and a guest pool 192.168.50.100 to 192.168.50.150
#   - for each pool, its own gateway and DNS address (the router's address on that subnet)
#   - the name web.test, answering 203.0.113.80
# Hint: dnsmasq can tag a pool (set:NAME) and send options only to that tag (tag:NAME).
