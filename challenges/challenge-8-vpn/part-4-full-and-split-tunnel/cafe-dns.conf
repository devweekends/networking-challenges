# cafe-dns.conf: the cafe's name server, on the cafe router (challenge 8, part 4).
# This file is given. dnsmasq here is only a DNS server: it answers questions about names.

# Listen on the cafe side only, on the router's own address there, 192.168.50.1.
interface=veth-cafe-in
bind-interfaces
# The lab has no real internet: no upstream servers, no /etc/hosts.
no-resolv
no-hosts
user=root
# A pid file of its own, so it does not clash with the office's dnsmasq.
pid-file=/tmp/networking-course-dns-cafe.pid
# Log every question to the screen (here: to the log file that bg_start keeps).
log-facility=-
log-queries
# The one name the cafe knows: the lab website.
address=/web.test/192.0.2.80
