# office-dns.conf: the office's name server, on the office router (challenge 8, part 4).
# This file is given. dnsmasq here is only a DNS server: it answers questions about names.

# Listen on the office side only, on the router's own address there, 10.20.0.1.
interface=br-office
bind-interfaces
# The lab has no real internet: no upstream servers, no /etc/hosts.
no-resolv
no-hosts
user=root
# A pid file of its own, so it does not clash with the cafe's dnsmasq.
pid-file=/tmp/networking-course-dns-office.pid
log-facility=-
log-queries
# The office knows the lab website too, and one name of its own that only the office knows.
address=/web.test/192.0.2.80
address=/intranet.test/10.20.0.5
