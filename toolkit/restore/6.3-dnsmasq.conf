# dnsmasq.conf for the capstone home router: the reference config, used by toolkit/restore/6.3.sh.
# One dnsmasq serves both subnets. Each subnet has its own pool, its own gateway and its own DNS address.
# Tags (set: and tag:) link a pool to its options.

# Listen on the two inside interfaces only: the home bridge and the guest plug. Not on the outside.
interface=br-home
interface=veth-hguest
bind-interfaces

# The lab has no real internet, so no upstream DNS. A name we do not know gets the answer REFUSED.
no-resolv
no-hosts
user=root
log-facility=-
log-dhcp
dhcp-leasefile=/tmp/networking-course-dnsmasq.leases

# Home pool and guest pool.
dhcp-range=set:home,192.168.1.100,192.168.1.150,255.255.255.0,1h
dhcp-range=set:guest,192.168.50.100,192.168.50.150,255.255.255.0,1h

# Each subnet's gateway and DNS server is the router's address on that subnet.
dhcp-option=tag:home,option:router,192.168.1.1
dhcp-option=tag:home,option:dns-server,192.168.1.1
dhcp-option=tag:guest,option:router,192.168.50.1
dhcp-option=tag:guest,option:dns-server,192.168.50.1

# One name of our own.
address=/web.test/203.0.113.80
